<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#0f2942"/>
      <stop offset="100%" stop-color="#123b4f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4fd1c5"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- Decorative geometric accents (subtle, not flashy) -->
  <circle cx="1080" cy="60" r="90" fill="#38bdf8" opacity="0.06"/>
  <circle cx="1140" cy="220" r="60" fill="#4fd1c5" opacity="0.07"/>
  <rect x="0" y="292" width="1200" height="8" fill="url(#accentGrad)"/>

  <!-- Bracket motif suggesting code -->
  <text x="60" y="150" font-family="Consolas, Menlo, monospace" font-size="90" fill="#4fd1c5" opacity="0.14" font-weight="700">&lt;/&gt;</text>

  <!-- Main name -->
  <text x="100" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#f8fafc">
    MD Fahim Rana
  </text>

  <!-- Role tagline -->
  <text x="100" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#94e2d5">
    Full-Stack Developer &#8226; Frontend-Focused &#8226; MERN &amp; Next.js
  </text>

  <!-- Sub line -->
  <text x="100" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#cbd5e1">
    Building real-world web applications &#8226; Dhaka, Bangladesh
  </text>

  <!-- Tech tags -->
  <g font-family="Consolas, Menlo, monospace" font-size="14" font-weight="500">
    <rect x="100" y="222" width="88" height="30" rx="15" fill="#ffffff" opacity="0.08"/>
    <text x="118" y="242" fill="#7dd3fc">Next.js</text>

    <rect x="198" y="222" width="94" height="30" rx="15" fill="#ffffff" opacity="0.08"/>
    <text x="216" y="242" fill="#7dd3fc">Express</text>

    <rect x="302" y="222" width="104" height="30" rx="15" fill="#ffffff" opacity="0.08"/>
    <text x="320" y="242" fill="#7dd3fc">MongoDB</text>

    <rect x="416" y="222" width="104" height="30" rx="15" fill="#ffffff" opacity="0.08"/>
    <text x="434" y="242" fill="#7dd3fc">TypeScript</text>

    <rect x="530" y="222" width="98" height="30" rx="15" fill="#ffffff" opacity="0.08"/>
    <text x="548" y="242" fill="#7dd3fc">Firebase</text>
  </g>
</svg>
